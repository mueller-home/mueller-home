<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StaffKeeping – Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2744;--navy-dark:#0f1a2e;--silver:#b8c4d4;
  --bg:#0d1526;--card:#162035;--border:rgba(184,196,212,0.13);
  --text:#dce4ef;--muted:#7a8fa8;--gold:#C9A96E;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);}

/* LAYOUT */
.shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:54px 1fr;height:100vh;}

/* TOPBAR */
.topbar{grid-column:1/3;grid-row:1;background:linear-gradient(135deg,var(--navy-dark),var(--navy));border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-i{width:30px;height:30px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.logo-t{font-size:15px;font-weight:800;color:white;letter-spacing:-0.5px;}
.logo-sub{font-size:9px;font-family:'DM Mono',monospace;color:var(--silver);margin-left:4px;}
.topbar-right{margin-left:auto;font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);}

/* SIDEBAR */
.sidebar{grid-column:1;grid-row:2;background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;}
.sb-section{font-size:9px;font-family:'DM Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:10px 16px 5px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--silver);transition:all 0.12s;border-left:3px solid transparent;user-select:none;}
.nav-item:hover{background:rgba(255,255,255,0.05);color:white;}
.nav-item.active{background:rgba(255,255,255,0.08);color:white;border-left-color:var(--gold);}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.nav-label{flex:1;}


/* MAIN */
.main{grid-column:2;grid-row:2;position:relative;overflow:hidden;}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;}
iframe.active{display:block;}

/* WELCOME */
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-family:'DM Mono',monospace;font-size:12.5px;}
.welcome-logo{width:60px;height:60px;background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.25);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:6px;}

/* LOADING */
.loading{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);z-index:10;}
.loading.show{display:flex;}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

function b64toHtml(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function openDoc(key) {
  // Nav
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById('nav-' + key);
  if (navEl) navEl.classList.add('active');

  // Topbar
  const cur = document.getElementById('current-doc');
  if (cur) cur.textContent = labels[key] || key;

  // Welcome ausblenden
  document.getElementById('welcome').style.display = 'none';

  // Alle Frames verstecken
  Object.values(iframes).forEach(f => f.classList.remove('active'));

  // Frame bereits geladen?
  if (iframes[key]) {
    iframes[key].classList.add('active');
    return;
  }

  // Loading zeigen
  document.getElementById('loading').classList.add('show');

  // Neuen Frame erstellen
  const fr = document.createElement('iframe');
  fr.id = 'frame-' + key;
  fr.sandbox = 'allow-scripts allow-same-origin allow-forms';
  iframes[key] = fr;
  document.getElementById('main').appendChild(fr);

  // HTML dekodieren und in Frame laden
  try {
    const html = b64toHtml(CONTENTS[key]);
    fr.srcdoc = html;
    fr.onload = () => {
      document.getElementById('loading').classList.remove('show');
      fr.classList.add('active');
    };
  } catch(e) {
    document.getElementById('loading').classList.remove('show');
    fr.srcdoc = '<body style="background:#0d1526;color:#ff6b6b;padding:30px;font-family:monospace">Fehler beim Laden: ' + e.message + '</body>';
    fr.classList.add('active');
  }
}
